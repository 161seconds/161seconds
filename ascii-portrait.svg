<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 320" width="370" height="320" fill="none">
  <style>
    .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; rx: 8px; }
    .title-bar { fill: #161b22; }
    .dot-red { fill: #ff5f56; }
    .dot-yellow { fill: #ffbd2e; }
    .dot-green { fill: #27c93f; }
    .term-title { fill: #8b949e; font-family: "JetBrains Mono", "Courier New", monospace; font-size: 11px; }
    
    text {
      fill: #58a6ff;
      font-family: "JetBrains Mono", "Courier New", monospace;
      font-size: 7.5px;
      letter-spacing: 1px;
      white-space: pre;
    }
    .row {
      opacity: 0;
      animation: typeRow 0.05s forwards;
    }
    @keyframes typeRow {
      to { opacity: 1; }
    }
  </style>

  <!-- Background -->
  <rect width="370" height="320" class="bg" />

  <!-- Window Header -->
  <path d="M 0 8 C 0 3.58 3.58 0 8 0 L 362 0 C 366.42 0 370 3.58 370 8 L 370 28 L 0 28 Z" class="title-bar" />
  <circle cx="16" cy="14" r="5" class="dot-red" />
  <circle cx="32" cy="14" r="5" class="dot-yellow" />
  <circle cx="48" cy="14" r="5" class="dot-green" />
  <text x="185" y="18" text-anchor="middle" class="term-title">portrait.ascii</text>

