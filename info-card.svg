<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 320" width="490" height="320" fill="none">
  <style>
    .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; rx: 8px; }
    .title-bar { fill: #161b22; }
    .dot-red { fill: #ff5f56; }
    .dot-yellow { fill: #ffbd2e; }
    .dot-green { fill: #27c93f; }
    .term-title { fill: #8b949e; font-family: "JetBrains Mono", "Courier New", monospace; font-size: 11px; }
    
    .code-text {
      font-family: "JetBrains Mono", "Courier New", monospace;
      font-size: 12px;
    }
    .key { fill: #58a6ff; font-weight: bold; }
    .val { fill: #c9d1d9; }
    .accent { fill: #39d353; font-weight: bold; }
    .sub { fill: #8b949e; }
    .prompt { fill: #ff7b72; font-weight: bold; }
    .user { fill: #79c0ff; font-weight: bold; }

    .line {
      opacity: 0;
      transform: translateX(-6px);
      animation: lineIn 0.35s ease forwards;
    }
    @keyframes lineIn {
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
  </style>

  <!-- Card Background -->
  <rect width="490" height="320" class="bg" />

  <!-- Terminal Window Bar -->
  <path d="M 0 8 C 0 3.58 3.58 0 8 0 L 482 0 C 486.42 0 490 3.58 490 8 L 490 28 L 0 28 Z" class="title-bar" />
  <circle cx="16" cy="14" r="5" class="dot-red" />
  <circle cx="32" cy="14" r="5" class="dot-yellow" />
  <circle cx="48" cy="14" r="5" class="dot-green" />
  <text x="245" y="18" text-anchor="middle" class="term-title">161seconds@github: ~ (neofetch)</text>

  <!-- Terminal Content Lines -->
  <g class="code-text" transform="translate(20, 52)">
    <g class="line" style="animation-delay: 0.08s;">
      <text y="0"><tspan class="prompt">➜</tspan> <tspan class="user">161seconds</tspan><tspan class="sub">@github</tspan></text>
      <text y="14" class="sub">---------------------------------------</text>
    </g>

    <g class="line" style="animation-delay: 0.16s;" transform="translate(0, 32)">
      <text y="0"><tspan class="key">Name      :</tspan> <tspan class="val">Nguyen Van Quoc Bao</tspan></text>
    </g>

    <g class="line" style="animation-delay: 0.24s;" transform="translate(0, 52)">
      <text y="0"><tspan class="key">Role      :</tspan> <tspan class="accent">Backend Developer in Progress</tspan></text>
    </g>

    <g class="line" style="animation-delay: 0.32s;" transform="translate(0, 72)">
      <text y="0"><tspan class="key">Education :</tspan> <tspan class="val">FPT University (Year 3)</tspan></text>
    </g>

    <g class="line" style="animation-delay: 0.40s;" transform="translate(0, 92)">
      <text y="0"><tspan class="key">Stack     :</tspan> <tspan class="val">C#, .NET Core, SQL Server, MongoDB</tspan></text>
    </g>

    <g class="line" style="animation-delay: 0.48s;" transform="translate(0, 112)">
      <text y="0"><tspan class="key">Interests :</tspan> <tspan class="val">APIs, System Design, Architecture</tspan></text>
    </g>

    <g class="line" style="animation-delay: 0.56s;" transform="translate(0, 132)">
      <text y="0"><tspan class="key">Motto     :</tspan> <tspan class="accent">Consistency &gt; Motivation</tspan></text>
    </g>

    <g class="line" style="animation-delay: 0.64s;" transform="translate(0, 152)">
      <text y="0"><tspan class="key">Status    :</tspan> <tspan class="val">Building cool stuff everyday 🚀</tspan></text>
    </g>

    <!-- Color Palette Blocks -->
    <g class="line" style="animation-delay: 0.72s;" transform="translate(0, 184)">
      <rect x="0"   y="0" width="22" height="12" rx="2" fill="#ff7b72" />
      <rect x="28"  y="0" width="22" height="12" rx="2" fill="#ffa657" />
      <rect x="56"  y="0" width="22" height="12" rx="2" fill="#d2a8ff" />
      <rect x="84"  y="0" width="22" height="12" rx="2" fill="#79c0ff" />
      <rect x="112" y="0" width="22" height="12" rx="2" fill="#58a6ff" />
      <rect x="140" y="0" width="22" height="12" rx="2" fill="#39d353" />
      <rect x="168" y="0" width="22" height="12" rx="2" fill="#f0f6fc" />
    </g>
  </g>
</svg>